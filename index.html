<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVR Promos - Best Video Production Company</title>

    <!-- Google Fonts (Inter & Oswald - matching bvrpromos.com) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@300;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Hero Section -->
    <section class="hero-section">
        <!-- Background Video with Dark Cinematic Overlay -->
        <div class="hero-video-wrapper">
            <video class="hero-video" autoplay muted loop playsinline preload="auto">
                <source src="assets/bvr-banner-bg.mp4" type="video/mp4">
            </video>
            <!-- <div class="hero-overlay"></div> -->
        </div>

        <!-- Bootstrap Container -->
        <div class="container hero-container">
            <div class="row align-items-center w-100 m-0">
                <!-- Left Side: Only H1 Tag -->
                <div class="col-md-6">
                    <h1 class="hero-title text-center text-md-start">
                        Best Video Production Company
                    </h1>
                </div>

                <!-- Right Side: View All Portfolio Button -->
                <div class="col-md-6 d-flex justify-content-md-end">
                    <a href="https://www.bvrpromos.com/video-portfolio" class="btn-bvr-portfolio"
                        title="View All Portfolio">
                        <span>View All Portfolio</span>
                        <span class="btn-arrow">&#10230;</span>
                    </a>
                </div>
            </div>

            <!-- Right Side Down: Brand Camera Icon (2nd Image) -->
            <div class="hero-bottom-right-icon">
                <img src="assets/bvr-camera-icon.svg" alt="BVR Camera Icon" class="bvr-icon-mark">
            </div>
        </div>
    </section>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>

</html>
